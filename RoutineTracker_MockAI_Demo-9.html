<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>RoutineTracker</title>
<meta name="description" content="말로 요청하면 AI 코치가 습관 루틴을 설계하고 관리해주는 습관 앱">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171A22" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="루틴트래커">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* RoutineTracker — base styles */
/* Layout: one phone-width app column. Five screens slide inside it, a bottom tab bar switches them.
   The AI screen is a chat log over a command composer; the other screens are scrolling card stacks. */
:root{
  --page:#E4E7EE; --bg:#F2F3F7; --surface:#FFFFFF; --surface-2:#F6F7FA; --line:#E2E5EC;
  --fg:#151925; --muted:#626A7D; --faint:#9AA1B2;
  --accent:#EE5A2B; --accent-2:#FF9F43; --accent-3:#F0568C; --accent-soft:#FDE9E1; --accent-ink:#FFFFFF;
  --ok:#11926C; --ok-soft:#DCF2EA; --warn:#B9800F; --warn-soft:#FBF0D7; --bad:#CF3A55; --bad-soft:#FBE4E8;
  --shadow:0 1px 2px rgba(21,25,37,.05),0 10px 30px -12px rgba(21,25,37,.14);
  --font-ui:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-display:'Bricolage Grotesque','IBM Plex Sans KR',-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  /* mixed tints, precomputed so older Safari / Samsung Internet render them */
  --mx-accent-22-t:rgba(238,90,43,0.22); --mx-accent-22-surface-2:#F4D4CC; --mx-accent-30-surface-2:#F4C8BC; --mx-accent-35-line:#E6B4A8; --mx-accent-40-t:rgba(238,90,43,0.40); --mx-accent-45-line:#E7A695; --mx-accent-45-surface-2:#F2B09D; --mx-accent-50-line:#E8A08C; --mx-accent-55-t:rgba(238,90,43,0.55); --mx-accent-60-t:rgba(238,90,43,0.60); --mx-accent-70-surface-2:#F08969; --mx-bad-55-surface-2:#E18F9F; --mx-ok-60-t:rgba(17,146,108,0.60); --mx-ok-soft-55-surface:#ECF8F3;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#08090D; --bg:#0F1117; --surface:#171A22; --surface-2:#1D212B; --line:#282D39;
  --fg:#ECEEF4; --muted:#979EB0; --faint:#626A7D;
  --accent:#FF6A3B; --accent-2:#FFAE57; --accent-3:#FF6E9D; --accent-soft:#3A2017; --accent-ink:#FFFFFF;
  --ok:#3DCB9C; --ok-soft:#123328; --warn:#E8B04A; --warn-soft:#352A12; --bad:#FF6F86; --bad-soft:#3A1822;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6); --mx-accent-22-t:rgba(255,106,59,0.22); --mx-accent-22-surface-2:#4F312F; --mx-accent-30-surface-2:#613730; --mx-accent-35-line:#73423A; --mx-accent-40-t:rgba(255,106,59,0.40); --mx-accent-45-line:#89483A; --mx-accent-45-surface-2:#834232; --mx-accent-50-line:#944C3A; --mx-accent-55-t:rgba(255,106,59,0.55); --mx-accent-60-t:rgba(255,106,59,0.60); --mx-accent-70-surface-2:#BB5436; --mx-bad-55-surface-2:#994C5D; --mx-ok-60-t:rgba(61,203,156,0.60); --mx-ok-soft-55-surface:#142825; color-scheme:dark;}}
:root[data-theme="dark"]{
  --page:#08090D; --bg:#0F1117; --surface:#171A22; --surface-2:#1D212B; --line:#282D39;
  --fg:#ECEEF4; --muted:#979EB0; --faint:#626A7D;
  --accent:#FF6A3B; --accent-2:#FFAE57; --accent-3:#FF6E9D; --accent-soft:#3A2017; --accent-ink:#FFFFFF;
  --ok:#3DCB9C; --ok-soft:#123328; --warn:#E8B04A; --warn-soft:#352A12; --bad:#FF6F86; --bad-soft:#3A1822;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6); --mx-accent-22-t:rgba(255,106,59,0.22); --mx-accent-22-surface-2:#4F312F; --mx-accent-30-surface-2:#613730; --mx-accent-35-line:#73423A; --mx-accent-40-t:rgba(255,106,59,0.40); --mx-accent-45-line:#89483A; --mx-accent-45-surface-2:#834232; --mx-accent-50-line:#944C3A; --mx-accent-55-t:rgba(255,106,59,0.55); --mx-accent-60-t:rgba(255,106,59,0.60); --mx-accent-70-surface-2:#BB5436; --mx-bad-55-surface-2:#994C5D; --mx-ok-60-t:rgba(61,203,156,0.60); --mx-ok-soft-55-surface:#142825; color-scheme:dark;}

html,body{height:100%}
body{background:var(--page);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{position:relative;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.screens{position:relative;flex:1;min-height:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateX(18px);transition:opacity .28s ease,transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s linear .32s}
.screen.left{transform:translateX(-18px)}
.screen.active{opacity:1;visibility:visible;transform:none;transition:opacity .28s ease,transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s}
.scroll > *{flex-shrink:0}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 28px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}

/* type */
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.h1{font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance;margin:2px 0 0}
.h2{font-weight:700;font-size:16px;margin:0}
.muted{color:var(--muted)}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-weight:700}
.mono{font-family:var(--font-mono);font-size:12px}

.card{background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;font-weight:600;font-size:14px;background:var(--surface-2);border:1px solid var(--line);transition:transform .12s ease,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;pointer-events:none}

/* staggered entry for cards when a tab opens; resting state is fully visible */
.enter > *{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.enter > *:nth-child(2){animation-delay:.05s}.enter > *:nth-child(3){animation-delay:.1s}.enter > *:nth-child(4){animation-delay:.15s}.enter > *:nth-child(5){animation-delay:.2s}.enter > *:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{transform:translateY(10px);opacity:.4}to{transform:none;opacity:1}}
.flash{animation:flash 2.4s ease-out 1}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--accent),var(--shadow)}12%{box-shadow:0 0 0 3px var(--accent),0 0 28px 2px var(--mx-accent-40-t)}100%{box-shadow:0 0 0 0 transparent,var(--shadow)}}
.kpis.flash,.bar.flash{border-radius:12px}
.newtag{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--accent-ink);background:var(--accent);padding:2px 6px;border-radius:6px}

/* ---------- tab bar ---------- */
.tabbar{position:relative;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:4px 6px 6px;overflow:hidden}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;justify-content:center;font-size:11px;font-weight:600;color:var(--faint);border-radius:12px;transition:color .2s}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.tab.active{color:var(--fg)}
.tab.active svg{transform:translateY(-1px) scale(1.06)}
.tab.active::before{content:"";position:absolute;top:2px;width:22px;height:3px;border-radius:3px;background:var(--accent)}
.tab .dot{position:absolute;top:9px;left:calc(50% + 9px);width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface);transform:scale(0);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.tab.badge .dot{transform:scale(1)}
.tabbar.sync::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--mx-accent-22-t),transparent);transform:translateX(-100%);animation:sweep 1s ease-out 1}
@keyframes sweep{to{transform:translateX(100%)}}

/* ---------- AI screen ---------- */
.ai-head{display:flex;align-items:center;gap:12px;padding:14px 16px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.ai-head .t{flex:1;min-width:0}
.ai-head .t b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em}
.ai-head .t span{font-size:12.5px;color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:var(--surface-2)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.orb{position:relative;width:38px;height:38px;flex:none;border-radius:50%;background:conic-gradient(from 210deg,var(--accent),var(--accent-2),var(--accent-3),var(--accent));box-shadow:0 0 18px -2px var(--mx-accent-60-t)}
.orb::after{content:"";position:absolute;inset:5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95),rgba(255,255,255,.25) 45%,transparent 70%)}
.orb.sm{width:28px;height:28px}
.orb.live{animation:spin 2.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.orb.pulse{animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 26px 2px var(--mx-accent-55-t)}}

.chat{flex:1;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.msg{display:flex;gap:10px;align-items:flex-start;animation:msgIn .35s cubic-bezier(.2,.8,.2,1)}
.msg.static{animation:none}
@keyframes msgIn{from{transform:translateY(8px);opacity:0}}
.msg.user{justify-content:flex-end}
.msg .body{min-width:0;flex:1;display:flex;flex-direction:column;gap:8px}
.msg.user .bubble{max-width:82%;background:var(--fg);color:var(--bg);border-radius:18px 18px 4px 18px;padding:10px 14px;white-space:pre-wrap;word-break:break-word}
.msg.ai .bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:12px 14px;box-shadow:var(--shadow);word-break:break-word}
.msg.ai .bubble b{font-weight:700}
.msg.sys{justify-content:center}
.msg.sys .bubble{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:5px 12px}
.tagline{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px}
.thinking .steps{display:flex;flex-direction:column;gap:6px;padding:10px 14px;background:var(--surface);border:1px dashed var(--mx-accent-45-line);border-radius:4px 18px 18px 18px}
.step{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);animation:msgIn .3s ease}
.step.cur{color:var(--fg);font-weight:600}
.step.cur .shimmer{background:linear-gradient(90deg,var(--fg) 30%,var(--accent) 50%,var(--fg) 70%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.2s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}
.step .ck{color:var(--ok);font-weight:700}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.optlist{display:grid;gap:8px}
.optlist .btn{justify-content:flex-start;border-radius:14px;background:var(--surface)}

.mini{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.mini h4{margin:0 0 8px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.changes li{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:5px 0;border-top:1px solid var(--line);animation:msgIn .35s both}
.changes li:first-child{border-top:0}
.changes ul{list-style:none;margin:0;padding:0}
.chg-ic{flex:none;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700}
.chg-ic.add{background:var(--ok-soft);color:var(--ok)}.chg-ic.update{background:var(--accent-soft);color:var(--accent)}.chg-ic.remove{background:var(--bad-soft);color:var(--bad)}.chg-ic.log{background:var(--surface-2);color:var(--muted)}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.jump button{font-size:12.5px;font-weight:600;color:var(--accent);padding:6px 10px;border-radius:999px;background:var(--accent-soft);min-height:32px}
.plan-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.pday{border-radius:10px;background:var(--surface-2);padding:7px 3px 6px;text-align:center;animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
.pday b{display:block;font-family:var(--font-display);font-size:13px}
.pday span{display:block;font-size:10px;color:var(--muted);line-height:1.25;margin-top:2px;word-break:keep-all}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat .k{font-size:11.5px;color:var(--muted)}
.stat .v{font-family:var(--font-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .v small{font-size:13px;font-weight:600;color:var(--muted)}
details.nlu{font-size:12px;color:var(--faint)}
details.nlu summary{cursor:pointer;list-style:none;display:inline-flex;gap:6px;align-items:center;padding:2px 0}
details.nlu summary::-webkit-details-marker{display:none}
details.nlu pre{margin:6px 0 0;padding:10px;border-radius:10px;background:var(--surface-2);color:var(--muted);font-family:var(--font-mono);font-size:11px;line-height:1.5;overflow-x:auto;max-height:240px}

.composer{background:var(--surface);border-top:1px solid var(--line);padding:10px 16px 12px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;font-weight:500;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);min-height:36px;white-space:nowrap;transition:transform .12s,border-color .2s}
.chip:active{transform:scale(.96)}
@media (hover:hover){.chip:hover{border-color:var(--mx-accent-50-line)}}
.inputrow{display:flex;gap:8px;align-items:flex-end;background:var(--surface-2);border:1.5px solid var(--line);border-radius:22px;padding:6px 6px 6px 14px;transition:border-color .2s,box-shadow .2s}
.inputrow:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
#input{flex:1;resize:none;border:0;outline:none;background:transparent;font:inherit;font-size:16px;color:var(--fg);max-height:120px;min-height:40px;padding:8px 0;line-height:1.45}
#input::placeholder{color:var(--faint)}
.send{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);transition:transform .15s,opacity .2s}
.send svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.send:disabled{opacity:.35}
.send:active{transform:scale(.92)}

/* ---------- today ---------- */
.hero{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .bgc{stroke:var(--surface-2)}
.ring .fgc{stroke:url(#ringGrad);transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .lbl b{font-family:var(--font-display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.ring .lbl span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.hero .meta{min-width:0;display:flex;flex-direction:column;gap:6px}
.goal{font-size:13.5px;color:var(--muted)}
.goal b{color:var(--fg);font-weight:600}
.brief{display:flex;gap:12px;align-items:flex-start}
.brief p{margin:0;font-size:14px}
.rlist{display:flex;flex-direction:column;gap:10px}
.ritem{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow);transition:background .3s,opacity .3s}
.ritem.done{background:var(--mx-ok-soft-55-surface)}
.ritem.fail{opacity:.75}
.hic{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px}
.ritem .info{flex:1;min-width:0}
.ritem .info b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.ritem.done .info b{text-decoration:line-through;text-decoration-color:var(--mx-ok-60-t)}
.ritem .info span{font-size:12.5px;color:var(--muted)}
.ract{display:flex;gap:6px;flex:none}
.rb{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;border:1.5px solid var(--line);background:var(--surface-2);font-size:18px;transition:transform .15s}
.rb:active{transform:scale(.9)}
.rb.ok{color:var(--ok)}.rb.no{color:var(--bad)}
.status{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;cursor:pointer}
.status.done{background:var(--ok-soft);color:var(--ok)}.status.fail{background:var(--bad-soft);color:var(--bad)}
.ritem.justdone .hic{animation:boing .6s cubic-bezier(.3,1.7,.5,1)}
@keyframes boing{30%{transform:scale(1.25) rotate(-6deg)}}
.burst{position:fixed;pointer-events:none;z-index:50;width:8px;height:8px;border-radius:2px;animation:burst .8s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
.empty{text-align:center;padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty p{margin:0;color:var(--muted);font-size:14px}

/* ---------- routines ---------- */
.hcard{display:flex;flex-direction:column;gap:12px}
.hhead{display:flex;gap:12px;align-items:center}
.hhead .info{flex:1;min-width:0}
.hhead b{font-size:17px}
.hhead .sub{font-size:12.5px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wd{text-align:center;font-size:11.5px;font-weight:600;border-radius:9px;padding:6px 0;background:var(--surface-2);color:var(--faint)}
.wd.on{color:#fff}
.wd.today{outline:2px solid var(--fg);outline-offset:1px}
.rline{display:flex;align-items:center;gap:10px;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.rline .tm{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);width:46px;flex:none}
.rline .tt{flex:1;min-width:0}
.plan{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.plan::-webkit-scrollbar{display:none}
.pl{flex:none;width:96px;border-radius:12px;padding:8px 10px;background:var(--surface-2);border:1.5px solid transparent}
.pl.cur{border-color:var(--accent);background:var(--accent-soft)}
.pl.past{opacity:.55}
.pl small{font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--muted)}
.pl p{margin:2px 0 0;font-size:12px;line-height:1.35;word-break:keep-all}
.linkbtn{align-self:flex-start;font-size:13px;font-weight:600;color:var(--accent);min-height:36px;display:inline-flex;align-items:center;gap:4px}

/* ---------- analytics ---------- */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.kpi .k{font-size:11.5px;color:var(--muted)}
.kpi .v{font-family:var(--font-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:600}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13.5px}
.bar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.fill{height:100%;border-radius:6px;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.plus{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:var(--bad);animation:plus 2.4s ease-out both}
@keyframes plus{0%{transform:translateY(6px) scale(.6);opacity:0}15%{transform:none;opacity:1}}
.cols{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:130px}
.cols.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.col{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.col .cv{font-size:11px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.col .cb{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--mx-accent-30-surface-2);height:0;transition:height .9s cubic-bezier(.2,.8,.2,1)}
.col.hi .cb{background:var(--accent)}
.col.lo .cb{background:var(--mx-bad-55-surface-2)}
.col .cl{font-size:12px;font-weight:600}
.col .cl small{display:block;font-size:10px;color:var(--faint);font-weight:500;text-align:center}
.report{border:1.5px solid var(--mx-accent-35-line)}
.report ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.report .insight{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-size:14px}

/* ---------- DNA ---------- */
.dna-hero{position:relative;overflow:hidden;padding:0}
.dna-hero canvas{display:block;width:100%;height:170px}
.dna-hero .cap{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px}
.persona{font-family:var(--font-display);font-size:24px;font-weight:800;letter-spacing:-.01em}
.traits{display:flex;flex-direction:column;gap:12px}
.trait .row{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
.trait .row b{font-weight:600}
.trait .track{height:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
.notes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px}
.notes li{display:flex;gap:8px}
.exp{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.exp:first-of-type{border-top:0;padding-top:0}
.exp .track{height:6px}

/* ---------- overlays ---------- */
.toast{position:absolute;left:16px;right:16px;top:12px;z-index:40;display:flex;align-items:center;gap:10px;background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 12px 10px 14px;font-size:13.5px;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);animation:toastIn .35s cubic-bezier(.2,.8,.2,1)}
.toast span{flex:1}
.toast button{font-weight:700;color:var(--accent-2);min-height:32px;padding:0 6px}
@keyframes toastIn{from{transform:translateY(-16px);opacity:0}}
.sheet-wrap{position:absolute;inset:0;z-index:45;background:rgba(10,12,18,.42);display:flex;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 16px 20px;display:flex;flex-direction:column;gap:12px;animation:up .32s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-size:11px;font-weight:700;color:var(--faint);text-align:center;padding-bottom:2px}
.cell{aspect-ratio:1;max-width:100%;border-radius:8px;display:flex;align-items:flex-start;justify-content:flex-end;padding:3px 5px;font-size:10.5px;font-weight:600;color:var(--muted);background:var(--surface-2);border:1.5px solid transparent;font-variant-numeric:tabular-nums}
.cell.l1{background:var(--mx-accent-22-surface-2)}.cell.l2{background:var(--mx-accent-45-surface-2)}
.cell.l3{background:var(--mx-accent-70-surface-2);color:#fff}.cell.l4{background:var(--accent);color:#fff}
.cell.miss{background:var(--surface);border:1.5px dashed var(--bad);color:var(--bad)}.cell.fut{opacity:.4}.cell.blank{background:transparent}
.cell.today{border-color:var(--fg)}.cell.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.calnav{display:flex;align-items:center;gap:6px}
.calnav button{width:34px;height:34px;border-radius:10px;background:var(--surface-2);font-size:15px}
.calfil{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:0 16px}
.calfil::-webkit-scrollbar{display:none}
.calfil button{flex:none;font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);min-height:32px}
.calfil button.on{background:var(--fg);color:var(--bg);border-color:transparent}
.legend2{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--faint);margin-top:8px}
.legend2 i{width:12px;height:12px;border-radius:3px;display:inline-block}
.dayd{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.hact{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hact .btn{min-height:36px;padding:0 12px;font-size:13px}
.hact .linkbtn{margin-left:auto}
.tabhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.btn.sm{min-height:40px;padding:0 14px;font-size:13.5px}
.form{display:flex;flex-direction:column;gap:14px}
.fl{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.fl input{font:inherit;font-size:16px;color:var(--fg);background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;min-height:46px;padding:0 12px;width:100%}
.fl input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.icons{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.ico,.dy{min-height:40px;border-radius:10px;background:var(--surface-2);border:1.5px solid var(--line);font-size:18px}
.dy{font-size:13px;font-weight:700;color:var(--muted)}
.ico.on{border-color:var(--accent);background:var(--accent-soft)}
.dy.on{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.ferr{margin:0;font-size:13px;color:var(--bad);font-weight:600}
.sheet{max-height:88%;overflow-y:auto}
.sheet textarea{font-family:var(--font-mono);font-size:16px;width:100%;min-height:140px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--fg);padding:10px;resize:vertical}
.sep{height:1px;background:var(--line);margin:2px 0}
.reasons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.reasons .btn{border-radius:14px;justify-content:flex-start}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* =====================================================================
   Mobile / PWA layer — overrides the base styles above.
   Targets: Android Chrome, Samsung Internet, iPhone Safari (browser + home-screen app)
   ===================================================================== */

/* --- page shell: no default margins, no page scroll, no pull-to-refresh bounce --- */
*,*::before,*::after{box-sizing:border-box}
html,body{width:100%;height:100%;min-height:100%;margin:0;padding:0;overflow:hidden;overscroll-behavior:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
img,canvas,svg{max-width:100%}

/* --- app column: always the visible screen height ---
   100vh → 100dvh (browsers that know dvh) → --app-h (exact visible height from JS, shrinks with the keyboard) */
.app{position:fixed;top:0;left:0;right:0;margin:0 auto;width:100%;height:100vh;height:100dvh;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.app.vv{height:var(--app-h,100dvh)}

/* --- notch / Dynamic Island / home indicator --- */
.ai-head{padding-top:calc(14px + env(safe-area-inset-top,0px))}
.scroll{padding-top:calc(18px + env(safe-area-inset-top,0px))}
.tabbar{padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.toast{top:calc(12px + env(safe-area-inset-top,0px))}
.sheet{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));max-height:calc(100% - 16px - env(safe-area-inset-top,0px));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* --- keyboard open: hide the tab bar so the input sits directly on the keyboard --- */
.kb-open .tabbar{display:none}
.kb-open .sheet{padding-bottom:16px}
.kb-open .chat{padding-bottom:4px}

/* --- touch: no text selection / callout / grey flash on controls, no double-tap zoom delay --- */
button,label.btn,.tab,.chip,.cell,.rb,[data-act]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button,input,textarea{-webkit-appearance:none;appearance:none}
button{cursor:pointer}
.chat,.scroll,.chips,.plan,.calfil,.sheet{-webkit-overflow-scrolling:touch}
/* native time/number inputs on iOS ignore width and centre their text */
.fl input{min-width:0;max-width:100%;display:block}
.fl input::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

/* --- finger-sized targets (≈44px) on touch screens --- */
@media (pointer:coarse){
  .chip{min-height:44px}
  .jump button{min-height:44px;padding:0 14px}
  .calnav button{width:44px;height:44px}
  .calfil button{min-height:40px;padding:0 12px}
  .toast button{min-height:44px;padding:0 12px}
  .status{min-height:40px;display:inline-flex;align-items:center}
  .linkbtn,.btn.sm,.hact .btn{min-height:44px}
  .icon-btn{width:44px;height:44px}
  .ico,.dy{min-height:44px}
  details.nlu summary{min-height:36px}
}

/* --- smooth animations: only transform / opacity per frame --- */
.screen{will-change:transform,opacity;backface-visibility:hidden;-webkit-backface-visibility:hidden;contain:layout paint}
.fill{transform-origin:left center;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.col .cb{transform-origin:bottom center;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
/* highlight ring: fade a pseudo-element instead of animating box-shadow */
.flash{animation:none;position:relative}
.flash::after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;
  box-shadow:0 0 0 3px var(--accent),0 0 26px 2px var(--mx-accent-40-t);opacity:0;animation:flashFade 2.4s ease-out 1}
@keyframes flashFade{12%{opacity:1}100%{opacity:0}}
/* breathing orb: animate opacity of a glow layer, not box-shadow */
.orb.pulse{animation:none}
.orb.pulse::before{content:"";position:absolute;inset:-4px;border-radius:50%;box-shadow:0 0 22px 4px var(--mx-accent-55-t);opacity:.25;animation:glow 3.6s ease-in-out infinite;pointer-events:none}
@keyframes glow{50%{opacity:1}}

/* --- small phones (320–359px) --- */
@media (max-width:359px){
  .scroll{padding-left:12px;padding-right:12px}
  .h1{font-size:25px}
  .kpis{gap:6px}.kpi{padding:10px}.kpi .v{font-size:22px}
  .hero{gap:12px}.ring{width:92px;height:92px}.ring .lbl b{font-size:22px}
  .bar{grid-template-columns:78px minmax(0,1fr) 40px;gap:8px}
  .icons{grid-template-columns:repeat(6,minmax(0,1fr))}
  .reasons{grid-template-columns:1fr}
  .tab{font-size:10.5px}
  .ai-head{gap:10px;padding-left:12px;padding-right:12px}
  .composer{padding-left:12px;padding-right:12px}.chips{margin:0 -12px;padding:0 12px}
  .chat{padding-left:12px;padding-right:12px}
}

/* --- landscape phones: compact chrome so the chat keeps room --- */
@media (orientation:landscape) and (max-height:520px){
  .app{max-width:760px}
  .ai-head{padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:6px}
  .ai-head .t span{display:none}
  .ai-head .orb{width:30px;height:30px}
  .tab{min-height:44px;flex-direction:row;gap:6px;font-size:12px}
  .tab.active::before{top:0}
  .tab .dot{top:6px}
  .composer{padding-top:6px;padding-bottom:6px;gap:6px}
  .chat{padding-top:8px;gap:10px}
  .scroll{padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .sheet{max-height:calc(100% - 8px)}
  .dna-hero canvas{height:120px}
}
.steps-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}

/* hidden tabs sit 18px to the side for the slide transition; clip them so focusing an input
   can never scroll the whole app sideways (overflow:clip can't be scrolled programmatically) */
.app,.screens{overflow:hidden;overflow:clip}
@media (max-width:400px){.icons{grid-template-columns:repeat(6,minmax(0,1fr))}.days{gap:4px}}
@media (orientation:landscape) and (max-height:520px){.kb-open .chips{display:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent-2)"/></linearGradient></defs></svg>
  <main class="screens">
    <section class="screen active" id="screen-ai" data-tab="ai" aria-label="AI">
      <header class="ai-head">
        <div class="orb pulse" id="headOrb"></div>
        <div class="t"><b>🧠 RoutineTracker AI</b><span>당신의 습관을 설계하고 관리해드릴게요.</span></div>
        <button class="icon-btn" id="resetBtn" aria-label="데이터 관리"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
      </header>
      <div class="chat" id="chat" aria-live="polite"></div>
      <div class="composer">
        <div class="chips" id="chips"></div>
        <div class="inputrow">
          <textarea id="input" rows="1" placeholder="원하는 루틴을 자유롭게 입력하세요..." aria-label="AI에게 메시지"></textarea>
          <button class="send" id="sendBtn" aria-label="보내기" disabled><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
      </div>
    </section>
    <section class="screen" id="screen-today" data-tab="today" aria-label="오늘"><div class="scroll" id="today"></div></section>
    <section class="screen" id="screen-routines" data-tab="routines" aria-label="루틴"><div class="scroll" id="routines"></div></section>
    <section class="screen" id="screen-analytics" data-tab="analytics" aria-label="분석"><div class="scroll" id="analytics"></div></section>
    <section class="screen" id="screen-dna" data-tab="dna" aria-label="DNA"><div class="scroll" id="dna"></div></section>
  </main>
  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="ai"><i class="dot"></i><svg viewBox="0 0 24 24"><path d="M12 3.5l1.9 4.9 4.9 1.9-4.9 1.9L12 17.1l-1.9-4.9-4.9-1.9 4.9-1.9z"/><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>AI</button>
    <button class="tab" data-tab="today"><i class="dot"></i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.3 12.4l2.5 2.5 4.9-5.2"/></svg>오늘</button>
    <button class="tab" data-tab="routines"><i class="dot"></i><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8.5 3v4M15.5 3v4"/></svg>루틴</button>
    <button class="tab" data-tab="analytics"><i class="dot"></i><svg viewBox="0 0 24 24"><path d="M5 20v-7M12 20V5M19 20v-10"/></svg>분석</button>
    <button class="tab" data-tab="dna"><i class="dot"></i><svg viewBox="0 0 24 24"><path d="M7 3c0 5 10 6.5 10 12 0 2.7-1.6 4.6-3 6M17 3c0 5-10 6.5-10 12 0 2.7 1.6 4.6 3 6"/><path d="M8.6 7h6.8M8.6 17.5h6.8"/></svg>DNA</button>
  </nav>
  <div class="toast" id="toast" hidden></div>
  <div class="sheet-wrap" id="sheet" hidden><div class="sheet" id="sheetBody"></div></div>
</div>
<noscript><p style="padding:24px;font-family:sans-serif">RoutineTracker를 사용하려면 브라우저에서 JavaScript를 켜주세요.</p></noscript>
<script>
/*CORE-START*/
/* =====================================================================
   RoutineTracker core — DOM-free. Mock AI, Action Handler, central state.
   Real AI can replace MockAI as long as it returns the same response shape:
   { message, actions:[{type,...}], ui:{steps,cards,buttons,suggestions,focus} }
   ===================================================================== */
const RT=(function(){
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=(d,n)=>{const x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;};
const parseYmd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12);};
const DAY_CODES=['SUN','MON','TUE','WED','THU','FRI','SAT'];
const WEEK=['MON','TUE','WED','THU','FRI','SAT','SUN'];
const DAY_KO={MON:'월',TUE:'화',WED:'수',THU:'목',FRI:'금',SAT:'토',SUN:'일'};
const KO_DAY={월:'MON',화:'TUE',수:'WED',목:'THU',금:'FRI',토:'SAT',일:'SUN'};
const dayOf=s=>DAY_CODES[parseYmd(s).getDay()];
let seq=0;const uid=p=>p+'_'+Date.now().toString(36)+(seq++).toString(36);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const DIFF_KO={beginner:'초급',intermediate:'중급',advanced:'고급'};
const LEVELS=['beginner','intermediate','advanced'];
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m;};
const fromMin=m=>{m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60);};
function fmtTime(t){if(!t)return '';const[h,m]=t.split(':').map(Number);const p=h<12?'오전':'오후';let hh=h%12;if(hh===0)hh=12;return `${p} ${hh}시${m?' '+m+'분':''}`;}
function fmtDays(days){if(!days||days.length===7)return '매일';const s=WEEK.filter(d=>days.includes(d)).join();if(s==='MON,TUE,WED,THU,FRI')return '평일';if(s==='SAT,SUN')return '주말';return WEEK.filter(d=>days.includes(d)).map(d=>DAY_KO[d]).join('·');}
function josa(w,pair){

  },

  ANALYZE_HABITS(e,c,s){

  WEEKLY_REPORT(e,c,s){
    const A=computeAnalytics(s);if(!A.week.total)return resp('이번 주에는 아직 기록이 없어요. 오늘 루틴부터 하나 체크해볼까요?',[],{steps:STEPS.analyze});

  const RS={meditation:['tired'],water:['forgot','busy','tired'],reading:['tired','tired','busy','motivation'],sleep:['tired','social','motivation','tired']};
  const push=(r,h,d,ok,reason)=>{const l={id:uid('l'),routineId:r.id,habitId:h.id,habitName:h.name,title:r.title,date:d,time:r.time,status:ok?'done':'fail',reason:ok?null:reason};s.routineLogs.push(l);if(!ok)s.failureReasons.push({id:uid('f'),logId:l.id,habitId:h.id,habitName:h.name,reason,date:d});};
  for(let i=21;i>=1;i--){const d=ymd(addDays(now,-i)),dk=dayOf(d);
    for(const r of s.routines){const h=s.habits.find(x=>x.id===r.habitId);let p=P[h.key];if(dk==='FRI')p-=.42;if(dk==='SAT'&&h.key==='sleep')p-=.25;if(h.key==='water'&&r.time>='16:00')p-=.15;
      let ok=rnd()<p;if(h.key!=='reading'&&i===1)ok=true;if(h.key==='reading'&&i<=2)ok=false;if(h.key==='reading'&&i===3)ok=true;
      push(r,h,d,ok,ok?null:(h.key==='reading'&&i<=2?'tired':RS[h.key][Math.floor(rnd()*RS[h.key].length)]));}}
  const T=ymd(now);const med=s.routines.find(r=>s.habits.find(h=>h.id===r.habitId).key==='meditation');const wat=s.routines.filter(r=>s.habits.find(h=>h.id===r.habitId).key==='water').sort((a,b)=>a.time.localeCompare(b.time))[0];
  push(med,s.habits.find(h=>h.id===med.habitId),T,true);push(wat,s.habits.find(h=>h.id===wat.habitId),T,true);
  s.analytics=computeAnalytics(s);
  s.aiMessages=[{id:'welcome',role:'ai',at:Date.now(),text:'안녕하세요, RoutineTracker AI예요.\n지금은 🧘 명상 · 💧 물 마시기 · 📖 독서 · 🌙 수면, 4개 습관을 함께 관리하고 있어요.\n\n하고 싶은 걸 편하게 말해주세요. 제가 루틴을 설계해서 보여드리고, **버튼을 누르면 앱 전체에 반영**할게요.',tag:'샘플 기록이 들어 있는 데모'}];
  return s;
}

<script>
/* =====================================================================

(function(){

const habitById=id=>state.habits.find(h=>h.id===id);

/* ---------- apply pipeline (shared by chat, buttons and tab controls) ---------- */

/* ---------- tabs ---------- */

function render(tab,entering){

}
const fl=(tab,id)=>pending[tab]&&pending[tab].has(id)?' flash':'';

/* count-ups, rings and bars animate from their previous value */
function animateIn(root){
  $$('[data-count]',root).forEach(el=>{const k=el.dataset.key,to=+el.dataset.count,suf=el.dataset.suffix||'';const from=k&&prev.has(k)?prev.get(k):0;if(k)prev.set(k,to);
    if(REDUCED||from===to){el.textContent=to+suf;return;}const t0=performance.now(),D=750;
    const step=n=>{const p=Math.min(1,(n-t0)/D);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-p,3)))+suf;if(p<1)requestAnimationFrame(step);};el.textContent=from+suf;requestAnimationFrame(step);});
  $$('[data-anim]',root).forEach(el=>{const k=el.dataset.key,prop=el.dataset.anim,to=el.dataset.to;const from=k&&prev.has(k)?prev.get(k):el.dataset.from;if(k)prev.set(k,to);
    /* bars: set the final size once, then animate only transform (GPU, no layout work per frame) */
    if(prop==='width'||prop==='height'){
      const f=parseFloat(from)||0,t=parseFloat(to)||0;el.style[prop]=to;
      if(REDUCED||t<=0||f===t)return;
      const r=Math.min(f/t,4),ax=prop==='width'?'X':'Y';
      el.style.transition='none';el.style.transform=`scale${ax}(${r})`;
      requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.transition='';el.style.transform='none';}));
      return;
    }
    el.style[prop]=from;requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style[prop]=to;}));});
}

/* ---------- TODAY ---------- */

  ${tot?`<div class="rlist">${items.map(({r,h,log})=>`
    <div class="ritem${log?' '+log.status:''}${fl('today',r.id)}" data-rid="${r.id}">

    </div>`).join('')}</div>`
  :`<div class="card empty"><div class="orb"></div><p>아직 오늘 루틴이 없어요.<br>AI에게 "운동 습관 만들어줘"라고 말해보세요.</p><div class="btnrow" style="justify-content:center"><button class="btn primary" data-act="ask" data-fill="🏃 운동 습관 만들어줘">AI에게 요청하기</button><button class="btn" data-act="addform">＋ 직접 추가</button></div></div>`}`;

  const T=RT.ymd(new Date());const logs=state.routineLogs.filter(l=>l.date===date&&(hid==='all'||l.habitId===hid));

/* ---------- ANALYTICS ---------- */
function renderAnalytics(){
  const A=state.analytics;if(!A.total)return `<div><div class="eyebrow">실행 패턴</div><h1 class="h1">분석</h1></div><div class="card empty"><div class="orb"></div><p>실행 기록이 쌓이면 성공률과 실패 원인을 분석해드려요.</p></div>`;

let helixRAF=0,helixPhase=0;
function setupHelix(){const c=$('#helix');if(!c)return;drawHelix();}
function startHelix(){cancelAnimationFrame(helixRAF);if(REDUCED){drawHelix();return;}const loop=()=>{if(current!=='dna')return;helixPhase+=.012;drawHelix();helixRAF=requestAnimationFrame(loop);};loop();}
function drawHelix(){
  const c=$('#helix');if(!c)return;const dpr=window.devicePixelRatio||1;const w=c.clientWidth,h=c.clientHeight;if(!w)return;
  if(c.width!==Math.round(w*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);}
  const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  const cs=getComputedStyle(document.documentElement);const line=cs.getPropertyValue('--line').trim()||'#ccc';const bg=cs.getPropertyValue('--surface').trim()||'#fff';
  const N=14,pad=22,step=(w-pad*2)/(N-1),mid=h/2,amp=h*.3;const now=new Date();
  const hs=state.habits;const days=[...Array(N)].map((_,i)=>RT.ymd(RT.addDays(now,i-(N-1))));
  for(let i=0;i<N;i++){const x=pad+i*step,a=i*.55+helixPhase;const y1=mid+Math.sin(a)*amp,y2=mid-Math.sin(a)*amp;
    g.strokeStyle=line;g.lineWidth=1.5;g.beginPath();g.moveTo(x,y1);g.lineTo(x,y2);g.stroke();
    hs.forEach((hb,j)=>{const t=hs.length>1?j/(hs.length-1):.5;const y=y1+(y2-y1)*t;const logs=state.routineLogs.filter(l=>l.habitId===hb.id&&l.date===days[i]);if(!logs.length)return;
      const ok=logs.some(l=>l.status==='done');const depth=(Math.cos(a)+1)/2;const r=2.6+depth*2.2;
      g.beginPath();g.arc(x,y,r,0,Math.PI*2);if(ok){g.fillStyle=hb.color;g.globalAlpha=.55+depth*.45;g.fill();}else{g.fillStyle=bg;g.fill();g.strokeStyle=hb.color;g.globalAlpha=.8;g.lineWidth=1.5;g.stroke();}g.globalAlpha=1;});}
  ['--accent','--accent-2'].forEach((v,k)=>{g.strokeStyle=cs.getPropertyValue(v).trim();g.lineWidth=2.5;g.beginPath();for(let x=pad;x<=w-pad+.5;x+=3){const a=((x-pad)/step)*.55+helixPhase;const y=mid+(k?-1:1)*Math.sin(a)*amp;x===pad?g.moveTo(x,y):g.lineTo(x,y);}g.stroke();});
}
window.addEventListener('resize',()=>{if(current==='dna')drawHelix();});

function copyBackup(){
  const txt=backupText();
  const show=()=>{$('#sheetBody').innerHTML=`<div class="grab"></div><div class="h2">백업 코드</div><p class="muted" style="margin:0;font-size:13px">아래 내용을 전부 선택해 복사한 뒤 메모장 등에 보관하세요.</p><textarea id="f-backup" readonly>${esc(txt)}</textarea><button class="btn ghost" data-act="closesheet">닫기</button>`;$('#sheet').hidden=false;const ta=$('#f-backup');ta.focus();ta.select();};
  try{navigator.clipboard.writeText(txt).then(()=>{toast('백업 코드를 복사했어요. 메모장 등에 붙여넣어 보관하세요.');$('#sheet').hidden=true;},show);}catch(e){show();}
}
function openPasteForm(){
  $('#sheetBody').innerHTML=`<div class="grab"></div><div class="h2">백업 코드 붙여넣기</div><label class="fl" for="f-paste">백업 코드<textarea id="f-paste" placeholder="복사해둔 백업 코드를 붙여넣으세요"></textarea></label><p class="ferr" id="f-err" hidden></p><button class="btn primary" data-act="pasteimport">불러오기</button><button class="btn ghost" data-act="closesheet">취소</button>`;
  $('#sheet').hidden=false;
}
let pendingImport=null;
function parseBackup(text){
  let o;try{o=JSON.parse(text);}catch(e){return {error:'백업 내용을 읽을 수 없어요. 코드 전체를 빠짐없이 붙여넣었는지 확인해주세요.'};}
  const st=o&&o.state?o.state:o;
  if(!st||st.v!==1||!Array.isArray(st.habits)||!Array.isArray(st.routines)||!Array.isArray(st.routineLogs))return {error:'RoutineTracker 백업 형식이 아니에요.'};
  return {state:st};
}
function confirmImport(text){
  const r=parseBackup(text);
  if(r.error){const err=$('#f-err');if(err){err.textContent=r.error;err.hidden=false;}else{toast(r.error);}return;}
  pendingImport=r.state;
  $('#sheetBody').innerHTML=`<div class="grab"></div><div class="h2">백업을 불러올까요?</div><p class="muted" style="margin:0;font-size:14px">백업: 습관 ${r.state.habits.length}개 · 기록 ${r.state.routineLogs.length}개<br>지금 데이터(습관 ${state.habits.length}개 · 기록 ${state.routineLogs.length}개)는 백업 내용으로 바뀌어요.</p><button class="btn primary" data-act="doimport">불러오기</button><button class="btn ghost" data-act="closesheet">취소</button>`;
  $('#sheet').hidden=false;
}
function doImport(){
  if(!pendingImport)return;const st=pendingImport;pendingImport=null;
  const base=RT.makeEmptyState();
  state=Object.assign(base,st,{user:Object.assign(base.user,st.user||{}),meta:Object.assign(base.meta,st.meta||{}),failureReasons:st.failureReasons||[],experiments:st.experiments||[],aiMessages:Array.isArray(st.aiMessages)?st.aiMessages:[]});
  const keep={lastReport:st.analytics&&st.analytics.lastReport,weeklyReport:st.analytics&&st.analytics.weeklyReport};state.analytics=Object.assign(RT.computeAnalytics(state),keep);
  state.aiMessages.push({id:newId(),role:'sys',text:`백업을 불러왔어요 · 습관 ${state.habits.length}개 · 기록 ${state.routineLogs.length}개`,at:Date.now()});
  Object.values(pending).forEach(x=>x.clear());badge.clear();prev.clear();
  $('#sheet').hidden=true;save();renderAll();renderChat();updateBadges();showTab('routines');
  toast('백업을 불러왔어요');
}
function reset(mode){
  state=mode==='empty'?Object.assign(RT.makeEmptyState(),{aiMessages:[{id:'welcome',role:'ai',at:Date.now(),text:'안녕하세요, RoutineTracker AI예요.\n아직 등록된 습관이 없어요. 만들고 싶은 습관을 편하게 말해주세요.\n예: "요즘 운동을 시작하고 싶은데 계속 미루게 돼"'}]}):RT.makeDemoState();
  if(mode==='empty')state.analytics=RT.computeAnalytics(state);
  Object.values(pending).forEach(s=>s.clear());badge.clear();prev.clear();
  $('#sheet').hidden=true;save();renderAll();renderChat();updateBadges();showTab('ai');
  setTimeout(maybeGreet,900);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const ic=e.target.closest('.ico');if(ic){$$('.ico').forEach(x=>x.classList.toggle('on',x===ic));iconTouched=true;return;}
  const dy=e.target.closest('.dy');if(dy){dy.classList.toggle('on');return;}
  const b=e.target.closest('[data-act],.tab');if(!b)return;
  if(b.classList.contains('tab')){showTab(b.dataset.tab);return;}
  const act=b.dataset.act;
  if(act==='chip'||act==='ask')fillInput(b.dataset.fill);
  else if(act==='tab')showTab(b.dataset.tab);
  else if(act==='done')completeFromTab(b.dataset.rid,b);
  else if(act==='fail')openFailSheet(b.dataset.rid);
  else if(act==='reason')failFromTab(b.dataset.rid,b.dataset.reason);
  else if(act==='undo')applyActions([{type:'UNDO_LOG',logId:b.dataset.log}]);
  else if(act==='closesheet')$('#sheet').hidden=true;
  else if(act==='reset')reset(b.dataset.mode);
  else if(act==='addform')openAddForm();
  else if(act==='export')exportFile();
  else if(act==='copybackup')copyBackup();
  else if(act==='pasteform')openPasteForm();
  else if(act==='pasteimport')confirmImport($('#f-paste').value);
  else if(act==='doimport')doImport();
  else if(act==='editform')openEditForm(b.dataset.hid);
  else if(act==='delask')openDeleteConfirm(b.dataset.hid);
  else if(act==='dodelete')doDelete(b.dataset.hid);
  else if(act==='clearchat')openClearChat();
  else if(act==='doclearchat')doClearChat();
  else if(act==='calnav'){cal.offset=Math.min(0,cal.offset+(+b.dataset.dir));cal.sel=null;render('analytics',false);}
  else if(act==='calhabit'){cal.habit=b.dataset.hid;render('analytics',false);}
  else if(act==='calday'){cal.sel=cal.sel===b.dataset.date?null:b.dataset.date;render('analytics',false);}
  else if(act==='mbtn'){const m=state.aiMessages.find(x=>x.id===b.dataset.mid);if(m&&m.buttons)runButton(m,m.buttons[+b.dataset.bi]);}
});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')$('#sheet').hidden=true;});
$('#resetBtn').addEventListener('click',openReset);
document.addEventListener('submit',e=>{if(e.target.id==='addForm'){e.preventDefault();submitAddForm();}else if(e.target.id==='editForm'){e.preventDefault();submitEditForm(e.target);}});
document.addEventListener('input',e=>{if(e.target.id==='f-name'&&!iconTouched){const ic=RT.guessIcon(e.target.value);$$('.ico').forEach(x=>x.classList.toggle('on',x.dataset.ico===ic));}});
document.addEventListener('change',e=>{if(e.target.id==='f-import'&&e.target.files[0]){const fr=new FileReader();fr.onload=()=>confirmImport(String(fr.result));fr.readAsText(e.target.files[0]);e.target.value='';}});
input.addEventListener('input',()=>{autoGrow();sendBtn.disabled=busy||!input.value.trim();});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){if(e.isComposing||e.keyCode===229)return;e.preventDefault();send(input.value);}});
sendBtn.addEventListener('click',()=>send(input.value));

renderAll();renderChat();updateBadges();
/* =====================================================================
   Mobile & PWA layer
   - visible-viewport sizing (iOS Safari address bar, on-screen keyboard)
   - install button (Android prompt / iPhone instructions)
   - service worker registration + "new version" prompt
   ===================================================================== */
const UA=navigator.userAgent||'';
const IS_IOS=/iP(hone|ad|od)/.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const IS_SAMSUNG=/SamsungBrowser/i.test(UA);
const isStandalone=()=>(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
const IS_WEB=/^https?:$/.test(location.protocol);

/* --- 1. keep the app exactly inside the visible area, and lift the composer above the keyboard --- */
(function(){
  const app=$('#app'),root=document.documentElement,vv=window.visualViewport;let raf=0,baseH=0;
  const isField=el=>!!el&&(el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&!/^(button|checkbox|radio|file|submit|range|color)$/i.test(el.type)));
  function fit(){
    raf=0;
    const h=Math.round(vv?vv.height:window.innerHeight);
    const top=vv?Math.max(0,Math.round(vv.offsetTop)):0;
    const typing=isField(document.activeElement);
    if(!typing||!baseH)baseH=Math.max(baseH,h);
    root.style.setProperty('--app-h',h+'px');
    app.style.top=top?top+'px':'';
    app.classList.add('vv');
    const kb=typing&&baseH-h>120;
    if(kb!==document.body.classList.contains('kb-open')){
      document.body.classList.toggle('kb-open',kb);
      if(kb&&document.activeElement===input)scrollChat();
    }
    if(kb){const el=document.activeElement;if(el.closest('.sheet'))el.scrollIntoView({block:'center'});}
  }
  const req=()=>{if(!raf)raf=requestAnimationFrame(fit);};
  if(vv){vv.addEventListener('resize',req);vv.addEventListener('scroll',req);}
  window.addEventListener('resize',req);
  window.addEventListener('orientationchange',()=>{baseH=0;setTimeout(req,250);setTimeout(req,600);});
  /* belt and braces for browsers without overflow:clip (Safari < 16): undo any sideways scroll */
  const unshift=()=>{if(app.scrollLeft)app.scrollLeft=0;const sc=$('.screens');if(sc&&sc.scrollLeft)sc.scrollLeft=0;};
  document.addEventListener('focusin',e=>{if(isField(e.target)){unshift();setTimeout(()=>{unshift();req();},60);setTimeout(req,400);}});
  document.addEventListener('focusout',()=>setTimeout(()=>{req();if(!isField(document.activeElement)&&(window.scrollY||document.documentElement.scrollTop))window.scrollTo(0,0);},150));
  /* iOS only fires :active styles when a touch listener exists */
  document.addEventListener('touchstart',()=>{},{passive:true});
  fit();
})();

/* --- 2. install --- */
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;});
window.addEventListener('appinstalled',()=>{deferredInstall=null;toast('홈 화면에 RoutineTracker를 추가했어요');});
function canOfferInstall(){return IS_WEB&&!isStandalone();}
function installApp(){
  if(deferredInstall){const p=deferredInstall;deferredInstall=null;$('#sheet').hidden=true;p.prompt();p.userChoice&&p.userChoice.then(c=>{if(c&&c.outcome==='accepted')toast('설치를 시작했어요');}).catch(()=>{});return;}
  const steps=IS_IOS
    ?['Safari 아래쪽의 <b>공유 버튼</b>(네모에 위쪽 화살표)을 눌러요.','목록을 올려서 <b>홈 화면에 추가</b>를 눌러요.','오른쪽 위 <b>추가</b>를 누르면 끝이에요.','<span class="muted">Chrome 등 다른 앱에서 열었다면 Safari로 열어주세요.</span>']
    :IS_SAMSUNG
    ?['오른쪽 아래 <b>메뉴(≡)</b>를 눌러요.','<b>현재 페이지 추가</b> → <b>홈 화면</b>을 눌러요.']
    :['오른쪽 위 <b>메뉴(⋮)</b>를 눌러요.','<b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 눌러요.'];
  $('#sheetBody').innerHTML=`<div class="grab"></div><div class="h2">📲 홈 화면에 앱 설치</div><p class="muted" style="margin:0;font-size:13.5px">설치하면 주소창 없이 앱처럼 열리고, 인터넷이 없어도 열려요.</p>
    <ol class="steps-list">${steps.map(s=>`<li>${s}</li>`).join('')}</ol>
    ${IS_IOS?'<p class="muted" style="margin:0;font-size:12.5px">홈 화면 앱은 Safari와 저장 공간이 따로예요. Safari에서 쓰던 기록은 백업 후 앱에서 불러오세요.</p>':''}
    <button class="btn ghost" data-act="closesheet">닫기</button>`;
  $('#sheet').hidden=false;
}
document.addEventListener('click',e=>{if(e.target.closest('[data-act="install"]'))installApp();});
if(isStandalone()&&navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

/* --- 3. service worker (only on http/https; a double-clicked local file just works without it) --- */
if(IS_WEB&&'serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./service-worker.js').then(reg=>{
      const ask=w=>toast('새 버전이 준비됐어요',{label:'업데이트',fn:()=>w.postMessage({type:'SKIP_WAITING'})},12000);
      if(reg.waiting&&navigator.serviceWorker.controller)ask(reg.waiting);
      reg.addEventListener('updatefound',()=>{const w=reg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)ask(w);});});
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{});});
    }).catch(()=>{});
    /* reload only when an update replaces a running version, never on the very first install */
    const hadController=!!navigator.serviceWorker.controller;let reloading=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadController||reloading)return;reloading=true;location.reload();});
  });
}

setTimeout(maybeGreet,700);
})();
</script>
